services:
  kv:
    image: node:22-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
    restart: unless-stopped
    command: ["node", "/app/server.mjs"]
    ports:
      - "8080:8080"
    environment:
      # Change with every code change: compose doesn't recreate the container for config content alone.
      - APP_VERSION=1
      - PREDECESSOR_URL=${PREDECESSOR_URL:-}
      - DORMANT=${DORMANT:-}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - kv:/data
    configs:
      - source: server
        target: /app/server.mjs

volumes:
  kv:

configs:
  server:
    content: |
      // A key-value server that hands its state and writer role to a successor CVM of the same app.
      // writer serves from disk; follower forwards to PREDECESSOR_URL and takes over at boot (unless
      // DORMANT); retired forwards to its successor. Whichever instance the gateway picks, the writer answers.
      import http from 'node:http'
      import fs from 'node:fs'
      import crypto from 'node:crypto'

      const { PORT = 8080, DATA_FILE = '/data/kv.json', DSTACK_SOCK = '/var/run/dstack.sock',
        PREDECESSOR_URL = '', DORMANT, SELF_URL, APP_VERSION } = process.env
      let s = { kv: {}, version: 0, role: PREDECESSOR_URL ? 'follower' : 'writer', target: PREDECESSOR_URL }
      // The role on disk wins over env: after an upgrade the env still names a predecessor that is gone.
      if (fs.existsSync(DATA_FILE)) s = JSON.parse(fs.readFileSync(DATA_FILE, 'utf8'))
      let hold = null, pending = null, committed = ''
      const save = () => { fs.writeFileSync(DATA_FILE + '.tmp', JSON.stringify(s)); fs.renameSync(DATA_FILE + '.tmp', DATA_FILE) }
      const sleep = ms => new Promise(r => setTimeout(r, ms))

      const dstack = (method, body) => new Promise((resolve, reject) => {
        const req = http.request({ socketPath: DSTACK_SOCK, path: '/' + method, method: 'POST',
        headers: { 'content-type': 'application/json' } }, res => {
          let out = ''
          res.on('data', d => { out += d })
          res.on('end', () => res.statusCode === 200 ? resolve(JSON.parse(out)) : reject(new Error(method + ' ' + res.statusCode + ' ' + out)))
        })
        req.on('error', reject)
        req.end(JSON.stringify(body))
      })

      // Same app_id, same key: only CVMs running a compose hash this app allows can derive it.
      const key = Buffer.from((await dstack('GetKey', { path: 'zero-downtime/handover' })).key.replace(/^0x/, ''), 'hex').subarray(0, 32)
      const mac = body => crypto.createHmac('sha256', key).update(body).digest('hex')
      function seal(obj, nonce) {
        const iv = crypto.randomBytes(12), c = crypto.createCipheriv('aes-256-gcm', key, iv).setAAD(Buffer.from(nonce))
        const ct = Buffer.concat([c.update(JSON.stringify(obj)), c.final()])
        return { iv: iv.toString('hex'), ct: ct.toString('hex'), tag: c.getAuthTag().toString('hex') }
      }
      function open(box, nonce) {
        const d = crypto.createDecipheriv('aes-256-gcm', key, Buffer.from(box.iv, 'hex')).setAAD(Buffer.from(nonce))
        d.setAuthTag(Buffer.from(box.tag, 'hex'))
        return JSON.parse(Buffer.concat([d.update(Buffer.from(box.ct, 'hex')), d.final()]).toString())
      }
      async function post(url, obj) {
        const body = JSON.stringify(obj)
        const r = await fetch(url, { method: 'POST', body, headers: { 'x-mac': mac(body) } })
        if (r.status !== 200) throw Object.assign(new Error(url + ' ' + r.status), { status: r.status })
        return r.json()
      }

      // Writer side. begin holds requests and returns the sealed state; commit retires this instance.
      // Without a commit within 15 s it goes back to serving.
      function begin({ nonce }) {
        if (s.role !== 'writer' || pending) return [409, {}]
        let release
        hold = new Promise(r => { release = r })
        pending = { nonce, release, timer: setTimeout(() => { pending = hold = null; release() }, 15000) }
        return [200, seal({ kv: s.kv, version: s.version }, nonce)]
      }
      function commit({ nonce, successor }) {
        if (committed === nonce) return [200, {}]
        if (pending?.nonce !== nonce) return [409, {}]
        clearTimeout(pending.timer)
        committed = nonce
        s.role = 'retired'
        s.target = successor
        save()
        pending.release()
        pending = hold = null
        return [200, {}]
      }

      // Successor side: hold our own requests, take the state, commit, then serve.
      async function takeOver() {
        const { instance_id } = await dstack('Info', {})
        const me = SELF_URL || PREDECESSOR_URL.replace(/\/\/[0-9a-f]+-/, '//' + instance_id + '-')
        for (;;) {
          const nonce = crypto.randomBytes(16).toString('hex')
          let release
          hold = new Promise(r => { release = r })
          try {
            const got = open(await post(s.target + '/_handover/begin', { nonce }), nonce)
            for (let i = 0; ; i++) {
              try { await post(s.target + '/_handover/commit', { nonce, successor: me }); break }
              catch (e) { if (e.status === 409 || i === 4) throw e; await sleep(1000) }
            }
            s = { ...got, role: 'writer', target: '' }
            save()
            return console.log('took over at version', s.version)
          } catch (e) {
            console.log('handover failed, retrying:', e.message)
          } finally {
            hold = null
            release()
          }
          await sleep(3000)
        }
      }

      const send = (res, status, obj) => { res.writeHead(status, { 'content-type': 'application/json' }); res.end(JSON.stringify(obj)) }
      const server = http.createServer(async (req, res) => {
        let body = ''
        for await (const d of req) body += d
        try {
          if (req.url === '/_status') return send(res, 200, { app: APP_VERSION, role: s.role, version: s.version })
          if (req.url.startsWith('/_handover/')) {
            if (req.headers['x-mac'] !== mac(body)) return send(res, 401, {})
            return send(res, ...(req.url === '/_handover/begin' ? begin : commit)(JSON.parse(body)))
          }
          if (hold) await hold
          if (s.role !== 'writer') {
            const hops = Number(req.headers['x-zdt-hops'] || 0)
            if (hops > 3) return send(res, 508, { error: 'forwarding loop' })
            const r = await fetch(s.target + req.url, { method: req.method, body: req.method === 'GET' ? undefined : body, headers: { 'x-zdt-hops': String(hops + 1) } })
            res.writeHead(r.status, { 'content-type': 'application/json' })
            return res.end(Buffer.from(await r.arrayBuffer()))
          }
          if (!req.url.startsWith('/kv/')) return send(res, 404, { error: 'use /kv/<key>' })
          const k = decodeURIComponent(req.url.slice(4))
          if (req.method === 'PUT') {
            s.kv[k] = body
            s.version++
            save()
            return send(res, 200, { version: s.version })
          }
          send(res, k in s.kv ? 200 : 404, { value: s.kv[k], version: s.version })
        } catch (e) {
          send(res, 502, { error: e.message })
        }
      }).listen(PORT, () => console.log('listening on', PORT, 'as', s.role))
      process.on('SIGTERM', () => server.close(() => process.exit(0)))

      if (s.role === 'follower' && !DORMANT) takeOver()
