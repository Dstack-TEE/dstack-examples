name: dstack-ingress Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'dstack-ingress-v*'

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom-domain/dstack-ingress
    env:
      IMAGE_REGISTRY: ghcr.io
    outputs:
      version: ${{ steps.version.outputs.version }}
      pinned-reference: ${{ steps.version.outputs.image-reference }}@${{ steps.capture-digest.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse and check version
        id: version
        run: |
          # The image records its version from the committed VERSION file, so
          # that a plain checkout reproduces the digest. The release tag only
          # selects which commit to build and must agree with that file.
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ -z "${VERSION}" ]; then
            echo "VERSION file is empty" >&2
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/tags/dstack-ingress-v*)
              TAG_VERSION=${GITHUB_REF#refs/tags/dstack-ingress-v}
              if [ "${TAG_VERSION}" != "${VERSION}" ]; then
                echo "Tag dstack-ingress-v${TAG_VERSION} does not match the VERSION file (${VERSION})." >&2
                echo "Update VERSION and re-tag, so the image version matches the release." >&2
                exit 1
              fi
              ;;
            *)
              echo "This workflow builds a release and must run on a dstack-ingress-v* tag." >&2
              echo "Got ref: ${GITHUB_REF}. Re-run it selecting the release tag." >&2
              exit 1
              ;;
          esac
          # GHCR rejects an uppercase path, and the owner is spelled
          # Dstack-TEE, so derive the repository rather than hardcode it.
          IMAGE_REPOSITORY=$(printf '%s/dstack-ingress' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REFERENCE="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}:${VERSION}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> "$GITHUB_ENV"
          echo "IMAGE_REFERENCE=${IMAGE_REFERENCE}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image-reference=${IMAGE_REFERENCE}" >> "$GITHUB_OUTPUT"
          echo "Parsed version: ${VERSION}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build reproducible image and push
        env:
          IMAGE_REFERENCE: ${{ env.IMAGE_REFERENCE }}
        run: |
          ./build-image.sh --require-clean --push "${IMAGE_REFERENCE}"

      - name: Capture image digest
        id: capture-digest
        run: |
          DIGEST=$(skopeo inspect oci-archive:./oci.tar | jq -r '.Digest')
          if [ -z "${DIGEST}" ]; then
            echo "Failed to determine image digest" >&2
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.capture-digest.outputs.digest }}
          push-to-registry: true

      - name: Publish summary
        env:
          IMAGE_REFERENCE: ${{ env.IMAGE_REFERENCE }}
          IMAGE_DIGEST: ${{ steps.capture-digest.outputs.digest }}
        run: |
          {
            echo "## dstack-ingress image"
            echo ""
            echo "- Tag: \`${IMAGE_REFERENCE}\`"
            echo "- Digest: \`${IMAGE_DIGEST}\`"
            echo "- Source: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/custom-domain/dstack-ingress\`"
            echo "- Sigstore: https://search.sigstore.dev/?hash=${IMAGE_DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## Docker Image Digest (SHA256)

            | Image | Digest | Verification |
            |---|---|---|
            | ${{ env.IMAGE_REFERENCE }} | ${{ steps.capture-digest.outputs.digest }} | [Verify on Sigstore](https://search.sigstore.dev/?hash=${{ steps.capture-digest.outputs.digest }}) |

            ## Source

            Built from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}/custom-domain/dstack-ingress). The image records its source repository, commit and version as OCI labels and manifest annotations:

            ```bash
            skopeo inspect docker://${{ env.IMAGE_REFERENCE }} | jq .Labels
            skopeo inspect --raw docker://${{ env.IMAGE_REFERENCE }} | jq .annotations
            ```

            ## Reproducible Build

            Build on a native Linux amd64 host with Docker Buildx, Skopeo, jq and Git installed:

            ```bash
            git clone ${{ github.server_url }}/${{ github.repository }}.git
            cd dstack-examples/custom-domain/dstack-ingress
            git checkout ${{ github.sha }}
            ./build-image.sh
            skopeo inspect oci-archive:./oci.tar | jq -r '.Digest'
            ```

            Expected digest: `${{ steps.capture-digest.outputs.digest }}`

  # Pinning the published digest into the examples is the step that gets
  # forgotten: 2.4 and 2.5 were both tagged and published without it, so every
  # compose file and README snippet in the repository kept deploying 2.3. Open
  # the pull request here, while the digest is in hand.
  pin-digest:
    needs: build-and-attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.build-and-attest.outputs.version }}
      PINNED_REFERENCE: ${{ needs.build-and-attest.outputs.pinned-reference }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          # Not the tag: the pull request has to target the branch, and the
          # branch may already have moved past the commit that was built.
          ref: ${{ github.event.repository.default_branch }}

      - name: Pin the published digest
        id: pin
        run: |
          ./custom-domain/dstack-ingress/pin-release.sh "${PINNED_REFERENCE}"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the pinned tree
        if: steps.pin.outputs.changed == 'true'
        run: ./dev.sh check-all

      - name: Open the pull request
        if: steps.pin.outputs.changed == 'true'
        run: |
          BRANCH="chore/pin-ingress-${VERSION}"
          TITLE="chore(ingress): pin dstack-ingress ${VERSION} digest from the release build"

          cat > /tmp/commit-message <<EOF
          ${TITLE}

          Published by the dstack-ingress-v${VERSION} release run from
          ${GITHUB_SHA}. Opened automatically: a release is not finished until
          the examples point at what it published.
          EOF

          cat > /tmp/pr-body <<EOF
          Step 3 of the release, opened by the \`dstack-ingress-v${VERSION}\` release run.
          Until it lands, every example in this repository still deploys the previous
          release -- which is how 2.4 and 2.5 both shipped.

          Every digest-pinned reference now reads:

          \`\`\`text
          ${PINNED_REFERENCE}
          \`\`\`

          \`./dev.sh check-all\` passed on this tree in the release run. GitHub does not
          start \`pull_request\` workflows for a pull request opened with \`GITHUB_TOKEN\`,
          so the check list below will be empty; close and reopen this pull request to
          run them for real.

          To verify the digest independently, on a native linux/amd64 host:

          \`\`\`bash
          git checkout dstack-ingress-v${VERSION}
          cd custom-domain/dstack-ingress
          ./build-image.sh
          skopeo inspect oci-archive:./oci.tar | jq -r '.Digest'
          \`\`\`
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "${BRANCH}"
          git commit -a -F /tmp/commit-message
          git push --force origin "${BRANCH}"

          if [ -n "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for ${BRANCH} is already open; pushed to it."
            exit 0
          fi

          gh pr create \
            --base "${DEFAULT_BRANCH}" \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body-file /tmp/pr-body
